<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperLens - 学术论文速递</title>
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="stylesheet" href="wechat.css">
    <style>
        :root {
            --nav-bg: rgba(255, 255, 255, 0.88);
            --nav-border: rgba(226, 232, 240, 0.8);
            --btn-bg: #ffffff;
            --btn-hover: #f1f5f9;
            --btn-text: #1e293b;
            --btn-border: #cbd5e1;
            --toast-bg: rgba(15, 23, 42, 0.92);
            --toast-text: #ffffff;
            --banner-bg: #eff6ff;
            --banner-border: #bfdbfe;
            --banner-text: #1e40af;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --nav-bg: rgba(15, 23, 42, 0.88);
                --nav-border: rgba(51, 65, 85, 0.8);
                --btn-bg: #1e293b;
                --btn-hover: #334155;
                --btn-text: #f8fafc;
                --btn-border: #475569;
                --toast-bg: rgba(248, 250, 252, 0.95);
                --toast-text: #0f172a;
                --banner-bg: rgba(30, 58, 138, 0.35);
                --banner-border: rgba(59, 130, 246, 0.4);
                --banner-text: #93c5fd;
            }
        }

        /* 顶部粘性导航栏 */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 500;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--nav-border);
            padding: 10px 16px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            user-select: none;
        }

        .nav-brand:hover {
            color: var(--accent);
        }

        .nav-brand-icon {
            font-size: 1.25rem;
        }

        #navigation {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--btn-text);
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
        }

        .nav-btn:hover:not(.disabled) {
            background: var(--btn-hover);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .nav-btn:active:not(.disabled) {
            transform: translateY(0);
        }

        .nav-btn.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        #date-picker {
            padding: 5px 10px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--btn-text);
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #date-picker:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }

        /* 提示条 */
        #banner-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .alert-banner {
            margin-top: 14px;
            padding: 10px 16px;
            background: var(--banner-bg);
            border: 1px solid var(--banner-border);
            color: var(--banner-text);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.875rem;
            animation: fadeIn 0.3s ease;
        }

        .alert-banner-content {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        .banner-close-btn {
            background: none;
            border: none;
            color: currentColor;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.7;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .banner-close-btn:hover {
            opacity: 1;
        }

        /* 主体内容区 */
        #main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 16px 40px;
        }

        /* 空状态占位 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            margin: 20px 0;
            box-shadow: var(--card-shadow);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-state-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .empty-state-desc {
            font-size: 0.875rem;
        }

        /* 轻量吐司提示 (Toast) */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast-msg {
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 9px 20px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s cubic-bezier(0.7, 0, 0.84, 0) 2.2s forwards;
            pointer-events: auto;
            white-space: nowrap;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-8px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            #navbar {
                padding: 8px 10px;
            }
            .nav-brand {
                display: none;
            }
            #navigation {
                width: 100%;
                justify-content: space-between;
            }
            #date-picker {
                flex-grow: 1;
                text-align: center;
                min-width: 120px;
            }
            #main-container {
                padding: 12px 10px 40px;
            }
            #banner-container {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <header id="navbar">
        <div class="nav-container">
            <a href="#" class="nav-brand" id="brand-link">
                <span class="nav-brand-icon">🔬</span>
                <span>PaperLens</span>
            </a>
            <div id="navigation">
                <a id="prev-link" class="nav-btn" href="#" title="上一天">← Prev</a>
                <input type="date" id="date-picker" aria-label="选择日期">
                <a id="next-link" class="nav-btn" href="#" title="下一天">Next →</a>
                <span id="last-update" style="display: none;"></span>
            </div>
        </div>
    </header>

    <div id="banner-container"></div>

    <main id="main-container">
        <div id="content">
            <!-- 这里会动态加载对应日期的 HTML 文件 -->
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
